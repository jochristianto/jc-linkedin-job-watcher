<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job Watcher — Popup</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* Only in the mockup: give the disposable popup a frame so you can see
         its ~380px width against the page. The real popup fills the toolbar
         bubble and has no such border. */
      body {
        padding: 24px;
        background: #d9d7d2;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1215;
        }
      }
      .view-popup {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        border-radius: 12px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- The list view, mounted as the POPUP: 380px, disposable, defaults to New.
         Markup below is exactly what mockups/render.ts emits. -->
    <div class="view-popup">
      <header class="hdr">
        <span class="hdr-title">New jobs</span>
        <span class="badge">4</span>
        <button class="hdr-btn" data-scan-state="idle" title="Scan every enabled search right now">Scan now</button>
        <button class="hdr-btn" title="Mark all as read">Mark all read</button>
        <button class="hdr-btn icon-only" title="Options" aria-label="Options"><svg class="lucide lucide-settings" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg></button>
      </header>

      <div class="toolbar">
        <div class="chips">
          <button class="chip" aria-pressed="true">All watches</button>
          <button class="chip" aria-pressed="false">Indonesia</button>
          <button class="chip" aria-pressed="false">Japan</button>
        </div>
        <div class="toggle">
          <button aria-pressed="true">New</button>
          <button aria-pressed="false">All</button>
        </div>
      </div>

      <!-- Every row carries its two actions: the tick dismisses just that job, the
           ban icon puts
           its company on the blocklist. Clicking the row itself opens the
           posting and leaves the row here, highlighted. -->
      <div class="list">
        <!-- Unread: filled dot, bold title -->
        <div class="job" data-job-id="3901" data-read="false" data-opened="false" data-blocked="false">
          <a class="job-main" href="#">
            <span class="job-dot" aria-hidden="true"></span>
            <span class="job-body">
              <span class="job-title">Senior Software Engineer</span>
              <span class="job-meta">Acme Corp · Jakarta, Indonesia</span>
              <span class="job-foot">2 hours ago · Indonesia</span>
            </span>
          </a>
          <span class="job-actions">
            <button class="job-btn" data-action="read" aria-pressed="false" title="Mark as read" aria-label="Mark as read"><svg class="lucide lucide-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button class="job-btn" data-action="block" aria-pressed="false" title="Block Acme Corp" aria-label="Block Acme Corp"><svg class="lucide lucide-ban" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/></svg></button>
          </span>
        </div>

        <!-- Opened: you clicked through to this one. Tinted with an accent bar,
             still unread, still here — only the tick removes it from New. -->
        <div class="job" data-job-id="3902" data-read="false" data-opened="true" data-blocked="false">
          <a class="job-main" href="#">
            <span class="job-dot" aria-hidden="true"></span>
            <span class="job-body">
              <span class="job-title">Backend Engineer (Go)</span>
              <span class="job-meta">PT Data Nusantara · Remote</span>
              <span class="job-foot">40 minutes ago · Indonesia</span>
            </span>
          </a>
          <span class="job-actions">
            <button class="job-btn" data-action="read" aria-pressed="false" title="Mark as read" aria-label="Mark as read"><svg class="lucide lucide-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button class="job-btn" data-action="block" aria-pressed="false" title="Block PT Data Nusantara" aria-label="Block PT Data Nusantara"><svg class="lucide lucide-ban" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/></svg></button>
          </span>
        </div>

        <!-- Missing location: the meta line degrades to just the company,
             no dangling separator (see #9 / render.ts metaLine). -->
        <div class="job" data-job-id="3903" data-read="false" data-opened="false" data-blocked="false">
          <a class="job-main" href="#">
            <span class="job-dot" aria-hidden="true"></span>
            <span class="job-body">
              <span class="job-title">Platform Engineer, Payments</span>
              <span class="job-meta">Momo Financial</span>
              <span class="job-foot">1 hour ago · Japan</span>
            </span>
          </a>
          <span class="job-actions">
            <button class="job-btn" data-action="read" aria-pressed="false" title="Mark as read" aria-label="Mark as read"><svg class="lucide lucide-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button class="job-btn" data-action="block" aria-pressed="false" title="Block Momo Financial" aria-label="Block Momo Financial"><svg class="lucide lucide-ban" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/></svg></button>
          </span>
        </div>

        <!-- Blocked company: greyed and tagged, but still on screen — blocking
             stops FUTURE scans surfacing it, it doesn't delete what's here. The
             the ban button is pressed, so it now reads "Unblock". Also shows the missing
             posted time degrading to just the watch name. -->
        <div class="job" data-job-id="3904" data-read="false" data-opened="false" data-blocked="true">
          <a class="job-main" href="#">
            <span class="job-dot" aria-hidden="true"></span>
            <span class="job-body">
              <span class="job-title">Staff Frontend Engineer</span>
              <span class="job-meta">Rakuten · Tokyo, Japan</span>
              <span class="job-foot">Japan<span class="job-tag">Blocked</span></span>
            </span>
          </a>
          <span class="job-actions">
            <button class="job-btn" data-action="read" aria-pressed="false" title="Mark as read" aria-label="Mark as read"><svg class="lucide lucide-check" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
            <button class="job-btn" data-action="block" aria-pressed="true" title="Unblock Rakuten" aria-label="Unblock Rakuten"><svg class="lucide lucide-ban" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/></svg></button>
          </span>
        </div>
      </div>
    </div>
  </body>
</html>
