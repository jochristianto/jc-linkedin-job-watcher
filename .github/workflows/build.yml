# Typechecks, tests and builds the extension on every PR into main, then — on
# merge — publishes the result as the newest release, so the latest dist/ is
# downloadable without a GitHub login:
#
#   https://github.com/jochristianto/jc-linkedin-job-watcher/releases/latest/download/jc-linkedin-job-watcher-dist.zip
#
# That URL resolves whichever release is flagged latest, not a tag literally
# named `latest`, so each merge gets its own `build-<version>-<sha>` tag. It has
# to: this repo has immutable releases on, which permanently freezes a published
# release *and* its tag, so nothing can move or be reused. Old builds are pruned
# at the end of the job to keep the Releases page from filling up.
#
# The asset filename is deliberately constant — that URL is in the README, so a
# per-version filename would break it on every merge. Version and commit go in
# the release notes instead.
#
# Note the build step runs `npm run build` (production), NOT `build:dev`. Only
# the "prefill" mode in vite.config.ts reads .env, so a CI build cannot bake in
# a Telegram token — there is nothing secret in the published zip.
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # So you can republish the release by hand without an empty commit.
  workflow_dispatch:

# Superseded runs on the same branch or PR are pointless; the newer one wins.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs everywhere, including PRs from forks. Deliberately read-only: the token
  # here can't publish anything, so PR code never runs with write access.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gates: a red branch neither merges green nor gets published.
      - run: npm run typecheck
      - run: npm test

      - run: npm run build

      - name: Package dist/
        id: package
        run: |
          version=$(node -p "require('./manifest.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Zip the *contents* of dist/, so unzipping gives the folder you point
          # "Load unpacked" at rather than a nested dist/dist.
          (cd dist && zip -qr ../jc-linkedin-job-watcher-dist.zip .)

      # Uploaded on PRs too, so a reviewer can install the branch build straight
      # from the run page without building it locally.
      - uses: actions/upload-artifact@v4
        with:
          name: jc-linkedin-job-watcher-dist
          path: jc-linkedin-job-watcher-dist.zip
          if-no-files-found: error

    outputs:
      version: ${{ steps.package.outputs.version }}

  # Merges and manual runs only — never PRs, so nothing lands in Releases until
  # the code is actually on main.
  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No checkout: `gh` works straight off the API, so it only needs GH_REPO.
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jc-linkedin-job-watcher-dist

      - name: Publish this build as the latest release
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="build-$VERSION-${GITHUB_SHA:0:7}"

          notes="Automatic build of \`main\` — manifest version \`$VERSION\`, commit \`${GITHUB_SHA:0:7}\`.

          Download **jc-linkedin-job-watcher-dist.zip**, unzip it, then load the
          unzipped folder via \`chrome://extensions\` → Developer mode → Load unpacked."

          # Immutable releases freeze a release the instant it is published, so
          # the zip has to be attached while it is still a draft — uploading
          # afterwards fails with "Cannot upload assets to an immutable release".
          # Publishing second also means the release only ever appears complete.
          gh release create "$tag" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "Latest build ($VERSION)" \
            --notes "$notes" \
            jc-linkedin-job-watcher-dist.zip

          gh release edit "$tag" --draft=false --latest

      - name: Prune superseded builds
        run: |
          # Every merge publishes one, so keep only the five most recent. The tag
          # is deletable once its release is gone, but never reusable, which is
          # fine — each tag carries a commit SHA. Tag cleanup is best-effort so a
          # cosmetic failure can't fail a green publish.
          gh release list --limit 100 --json tagName,createdAt,isDraft \
            --jq '[.[] | select(.isDraft == false and (.tagName | startswith("build-")))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            [ -n "$old" ] || continue
            echo "Pruning $old"
            gh release delete "$old" --yes
            gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$old" || true
          done
